# ============================================================
# Nginx: раздача фронтенда + обратный прокси на API
# ============================================================

# Сжатие
gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ---------- Статика: агрессивный кэш (имена файлов меняются между релизами) ----------
  location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|json)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # PWA-манифест — не кэшировать (чтобы правки подхватывались сразу)
  location = /manifest.json {
    add_header Cache-Control "no-cache";
    types { application/manifest+json json; }
  }

  # ---------- Служебные файлы ----------
  location = /favicon.ico { log_not_found off; access_log off; }
  location = /robots.txt  { log_not_found off; access_log off; }

  # ---------- SPA: всё, что не файл, отдаём index.html ----------
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ---------- Прокси на API ----------
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Загрузка больших файлов (видео до 500 МБ) — таймауты увеличены
    client_max_body_size 600m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}